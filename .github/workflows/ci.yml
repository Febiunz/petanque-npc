name: CI (Build validation)

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (install + smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit (high severity, non-blocking)
        run: npm audit --audit-level=high || true

      - name: Smoke test API
        env:
          PORT: '5000'
          FIREBASE_PROJECT_ID: ci-dummy-project
        run: |
          node index.js &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/api/health > /dev/null; then
              break
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Backend process exited before becoming healthy"
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://localhost:5000/api/health
          curl -fsS "http://localhost:5000/api/teams?divisieId=1001" > /dev/null
          curl -fsS "http://localhost:5000/api/matches/schedule?divisieId=1001" > /dev/null
          curl -fsS "http://localhost:5000/api/standings?divisieId=1001" > /dev/null

  frontend:
    name: Frontend (install + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit (high severity, non-blocking)
        run: npm audit --audit-level=high || true

      - name: Build
        env:
          # Placeholder values: the build must not require real Firebase secrets.
          VITE_FIREBASE_API_KEY: ci-dummy
          VITE_FIREBASE_AUTH_DOMAIN: ci-dummy.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-dummy
          VITE_FIREBASE_STORAGE_BUCKET: ci-dummy.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '0'
          VITE_FIREBASE_APP_ID: '1:0:web:0'
        run: npm run build
